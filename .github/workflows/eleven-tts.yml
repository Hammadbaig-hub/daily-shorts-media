name: ElevenLabs voice

# Started by the daily Shorts routine (Claude) after it pushes voice/<date>/segments.json.
# Makes the Urdu narration with ElevenLabs and commits seg*.mp3 + seg*.json back.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Folder with segments.json, e.g. voice/2026-11-12"
        required: true

permissions:
  contents: write

concurrency:
  group: eleven-tts
  cancel-in-progress: false

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate narration
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
          JOB: ${{ inputs.job }}
        run: |
          case "$JOB" in voice/*) ;; *) echo "job must be under voice/"; exit 1;; esac
          python3 tools/scripts/eleven_tts.py "$JOB"
      - name: Commit audio
        env:
          JOB: ${{ inputs.job }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$JOB"
          git commit -m "Voice: $JOB" || echo "nothing to commit"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 3; done
